name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------- Build (also runs on PRs to catch broken markdown) ----------
  build:
    name: mkdocs build --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install mkdocs + material
        run: |
          python -m pip install --upgrade pip
          pip install "mkdocs>=1.6" "mkdocs-material>=9.5" "pymdown-extensions>=10"

      - name: Build (strict — fails on broken refs)
        run: mkdocs build --strict

      - name: Upload built site as artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/

  # ---------- Deploy to the `gh-pages` branch on main ----------
  # The SPA's release workflow uses Actions-based Pages deployment, which
  # conflicts with branch-based. So we deploy docs to gh-pages branch and
  # leave the published-source toggle in repo settings to the maintainer.
  # When the docs.vellaris.dev CNAME / subhayu99/vellaris-docs repo lands,
  # this job switches over.
  deploy:
    name: Deploy to gh-pages branch
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: |
          python -m pip install --upgrade pip
          pip install "mkdocs>=1.6" "mkdocs-material>=9.5" "pymdown-extensions>=10"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: mkdocs gh-deploy
        run: mkdocs gh-deploy --force --clean
