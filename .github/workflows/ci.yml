name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: mypy
        run: mypy src/vellaris

  test:
    name: Test (pytest, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        run: pytest

      - name: core/ coverage gate
        if: matrix.python-version == '3.12'
        run: |
          coverage run -m pytest
          coverage report --include="src/vellaris/core/*" --fail-under=100

  web:
    name: Web SPA (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: format:check
        run: pnpm format:check

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: test
        run: pnpm test

      - name: build
        run: pnpm build

      - name: bundle-size gate (≤ 500 KB gzipped)
        run: |
          # Sum gzipped bytes across all built js + css.
          total=$(find dist/assets -type f \( -name '*.js' -o -name '*.css' \) -exec gzip -c {} + | wc -c)
          limit=$((500 * 1024))
          echo "gzipped bundle = $total bytes (limit $limit)"
          if [ "$total" -gt "$limit" ]; then
            echo "::error::bundle exceeds the 500 KB gzipped budget"
            exit 1
          fi

  web-interop:
    name: Web ↔ Python byte-level interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install vellaris (server extras for fixture generation)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Regenerate fixtures from the Python source of truth
        run: python web/tests/fixtures/generate.py

      - name: pnpm install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run interop test against fresh Python-produced fixtures
        working-directory: web
        run: pnpm test src/api/_b64.test.ts tests/interop.test.ts
