[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vellaris"
version = "0.5.7"
description = "End-to-end encrypted document sharing you self-host."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Subhayu Kumar Bala", email = "balasubhayu99@gmail.com" },
]
keywords = ["encryption", "e2ee", "document-sharing", "self-hosted", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Archiving",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "cryptography>=42",
    "argon2-cffi>=23",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0",
    "greenlet>=3.0",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "pydantic[email]>=2.8",
    "python-multipart>=0.0.12",
    "fsspec>=2024.10",
]
sqlite = ["aiosqlite>=0.20"]
postgres = ["asyncpg>=0.29", "psycopg2-binary>=2.9"]
mysql = ["asyncmy>=0.2.10", "pymysql>=1.1"]
s3 = ["s3fs>=2024.10"]
gcs = ["gcsfs>=2024.10"]
azure = ["adlfs>=2024.7"]
all-db = ["vellaris[sqlite,postgres,mysql]"]
all-storage = ["vellaris[s3,gcs,azure]"]
all = ["vellaris[server,all-db,all-storage]"]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pre-commit>=3.8",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    # Server (mirrors [server])
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0",
    "greenlet>=3.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
    "pydantic[email]>=2.8",
    "python-multipart>=0.0.12",
    "fsspec>=2024.10",
    # Drivers (everything bundled for tests)
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "asyncmy>=0.2.10",
    "pymysql>=1.1",
    # Storage
    "s3fs>=2024.10",
    "moto[s3]>=5.0",
]

[project.scripts]
vellaris = "vellaris.cli.main:app"
vellaris-server = "vellaris.server.cli:main"

[project.urls]
Homepage = "https://github.com/subhayu99/vellaris"
Repository = "https://github.com/subhayu99/vellaris"
Issues = "https://github.com/subhayu99/vellaris/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vellaris"]

[tool.hatch.build.targets.wheel.force-include]
"alembic" = "vellaris/_alembic"
"alembic.ini" = "vellaris/server/alembic.ini"

[tool.hatch.build.targets.sdist]
include = [
    "src/vellaris",
    "alembic",
    "alembic.ini",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length is checked elsewhere; ruff format handles wraps
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["argon2.*", "boto3.*", "botocore.*", "moto.*", "fsspec.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src/vellaris"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@overload",
]
